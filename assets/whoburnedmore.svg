.rise{animation:rise .7s cubic-bezier(.22,1,.36,1) both}
.live{animation:breathe 2.4s ease-in-out infinite}
.today{animation:grow .8s cubic-bezier(.22,1,.36,1) both,breathe 3s ease-in-out 1.6s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
